<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Indigo to Dark Blue-Purple -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Domino Bone Gradient: Elegant ivory white -->
    <linearGradient id="boneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>

    <!-- Metallic Pivot Pin: Traditional Brass/Gold Glow -->
    <radialGradient id="brassPin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Drop Shadow for the Domino Board -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Inner Soft Accent Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="24" />

  <!-- Domino Piece Model (Tilted elegantly for a dynamic logo look) -->
  <g transform="translate(256, 256) rotate(-15)">
    <!-- Domino Tile Body -->
    <rect x="-80" y="-150" width="160" height="300" rx="20" fill="url(#boneGradient)" filter="url(#shadow)" stroke="#E5E7EB" stroke-width="4" />

    <!-- Top Half dots (Number: 5) -->
    <g transform="translate(0, -75)">
      <!-- Top Left Dot -->
      <circle cx="-40" cy="-40" r="11" fill="#1E1B4B" />
      <!-- Top Right Dot -->
      <circle cx="40" cy="-40" r="11" fill="#1E1B4B" />
      <!-- Center Dot -->
      <circle cx="0" cy="0" r="11" fill="#1E1B4B" />
      <!-- Bottom Left Dot -->
      <circle cx="-40" cy="40" r="11" fill="#1E1B4B" />
      <!-- Bottom Right Dot -->
      <circle cx="40" cy="40" r="11" fill="#1E1B4B" />
    </g>

    <!-- Center Line & Brass Divider Pin -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#D1D5DB" stroke-width="3" />
    <circle cx="0" cy="0" r="9" fill="url(#brassPin)" stroke="#92400E" stroke-width="1.5" />

    <!-- Bottom Half dots (Number: 6) -->
    <g transform="translate(0, 75)">
      <!-- Left Column -->
      <circle cx="-40" cy="-40" r="11" fill="#1E1B4B" />
      <circle cx="-40" cy="0" r="11" fill="#1E1B4B" />
      <circle cx="-40" cy="40" r="11" fill="#1E1B4B" />
      
      <!-- Right Column -->
      <circle cx="40" cy="-40" r="11" fill="#1E1B4B" />
      <circle cx="40" cy="0" r="11" fill="#1E1B4B" />
      <circle cx="40" cy="40" r="11" fill="#1E1B4B" />
    </g>
  </g>
</svg>
